name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - name: Sample briefs are up to date
        run: |
          node dist/src/cli.js examples/msp-es.json > /tmp/en.md
          diff /tmp/en.md docs/sample-brief.md
          node dist/src/cli.js --lang es examples/msp-es.json > /tmp/es.md
          diff /tmp/es.md docs/sample-brief.es.md
